[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqliscan"
version = "2.0.0"
description = "SQL injection scanner with baseline differencing, dual-request confirmation and evidence capture."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Youssef Alaoui Hichami", email = "alaouihichamiyoussef@gmail.com" }]
maintainers = [{ name = "Youssef Alaoui Hichami", email = "alaouihichamiyoussef@gmail.com" }]
keywords = ["security", "sqli", "sql-injection", "scanner", "pentest", "bug-bounty"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<0.29"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/7xd10/SQLi-detector"
Issues = "https://github.com/7xd10/SQLi-detector/issues"
Changelog = "https://github.com/7xd10/SQLi-detector/blob/main/CHANGELOG.md"

[project.scripts]
sqliscan = "sqliscan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqliscan = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH",
  "PL", "RUF", "S", "DTZ", "T20", "TRY", "EM", "LOG", "G", "ISC", "ICN",
]
ignore = [
  "PLR0913",  # a scanner constructor legitimately takes many knobs
  "PLR2004",  # comparison against a literal is clear in tests and tables
  "PLR0911",  # dispatch functions legitimately return early
  "PLR0912",  # the crawl loop has one branch per bound
  "PLR0915",  # the crawl loop has one statement per bound
  "N818",     # exceptions are named for what happened, not with an Error suffix
  "TRY003",   # long messages belong at the raise site
  "EM101",    # string literals in exceptions are fine here
  "EM102",    # f-strings in exceptions are fine here
  "S311",     # jitter is not cryptographic
  "DTZ005",   # monotonic clock has no timezone
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR0915", "ARG001", "ARG002"]
"sqli.py" = ["T201", "PLC0415"]
"src/sqliscan/cli.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src/sqliscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/sqliscan"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
